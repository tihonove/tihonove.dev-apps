apiVersion: v1
kind: Namespace
metadata:
  name: budget-tools
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: budget-tools
spec:
  hard:
    pods: "20"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 2Gi
    persistentvolumeclaims: "5"
    requests.storage: 20Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: budget-tools
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-budget-tools
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux
  namespace: budget-tools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: app-budget-tools
    namespace: flux-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: app-budget-tools
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/tihonove/budget-tools
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-budget-tools
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: app-budget-tools
  path: ./deploy
  prune: true
  wait: true
  force: true
  targetNamespace: budget-tools
  serviceAccountName: app-budget-tools
  decryption:
    provider: sops
    secretRef:
      name: sops-age
