apiVersion: v1
kind: Namespace
metadata:
  name: podinfo
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: podinfo
spec:
  hard:
    pods: "20"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 2Gi
    persistentvolumeclaims: "5"
    requests.storage: 20Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: podinfo
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-podinfo
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux
  namespace: podinfo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: app-podinfo
    namespace: flux-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: app-podinfo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/stefanprodan/podinfo
  ref:
    branch: master
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-podinfo
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: app-podinfo
  path: ./kustomize
  prune: true
  wait: true
  force: true
  targetNamespace: podinfo
  serviceAccountName: app-podinfo
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# Только для теста: у podinfo в репо нет Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podinfo
  namespace: podinfo
spec:
  tls:
    - hosts: [podinfo.tihonove.dev]
  rules:
    - host: podinfo.tihonove.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podinfo
                port:
                  number: 9898
